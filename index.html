<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="style.css">
	<title>latihan</title>
</head>
<body>

	<div class="container">
		<div class="card">

		<h2>KALKULATOR SEDERHANA</h2>

		<div class="input-group">
			<input from ="form"  id = "angka_1">
		</div>

		<div class="input-group">
			<select id = operator>
				<class = form-selected>
					<option selected>Operasi</option>
					<option value="+">+</option>
					<option value="-">-</option>
					<option value="*">x</option>
					<option value="/">/</option>
			</select>

				
		</div>

		<div class="input-group">
			<input from ="form"  id = "angka_2">

			<div class="samaDengan">
				<button id = "samaDengan">=</button>
			</div>
		

			<div class="hasil">
				<button class="input-group" id = "hasil"><b>Hasil</b></button>
			</div>
		</div>
		</div>
	</div>

	
	<script src="script.js"></script>
</body>
</html>
